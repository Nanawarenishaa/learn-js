<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=qce333331">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Currency Converter</title>
</head>
<body>
    <h1>Currency Converter</h1>
    <form action="">
        <div class="amount amount-container ">
            <label for="amount">Amount:</label>
            <input type="number" id="amount"
            value="100" name="amount" required>
        </div>

        <div class="dropdown">
            
            <div class="from">
                <p class="from"> From</p>
                <div class="select-conatiner">
                    <img src="https://flagsapi.com/US/flat/64.png" alt="arrow" class>
                    <select name="from" id="from">
                        
                    </select>
                </div>

               
                
            </div>
            <i class="fa-solid fa-arrow-right-arrow-left"></i>
            
            <div class="to">

                 <p class="to">To:</p>
                <div class="select-conatiner">
                    <img src="https://flagsapi.com/IN/flat/64.png" alt="arrow" class>
                    <select name="to" id="to">
                       
                    </select>
                </div>
            </div>

            
             <div class="msg" id="msg">
                Loading exchange rate...
            </div>
            <button id="convert">Convert</button>
        </div>
    </form>

    <script src="./script.js"></script>
</body>
</html>
